name: Build SSS 1 Mathematics APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3

      - name: Initialize Capacitor
        run: npx cap init "SSS 1 Mathematics" "com.sss1mathematics.app" --web-dir=.

      - name: Add Android platform
        run: npx cap add android

      - name: Copy web files
        run: npx cap copy android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSS-1-Mathematics-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SSS 1 Mathematics</title>

    <!-- Connect to style.css -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>SSS 1 Mathematics</h1>
        <p>35 Topics Mathematics Learning App</p>
    </header>

    <main>

        <h2>Select a Topic</h2>

        <select id="topicSelect" onchange="showTopic()">
            <option value="">-- Select a Topic --</option>

            <option value="1">1. Number Bases</option>
            <option value="2">2. Fractions and Decimals</option>
            <option value="3">3. Approximation and Estimation</option>
            <option value="4">4. Standard Form</option>
            <option value="5">5. Logarithms</option>
            <option value="6">6. Indices</option>
            <option value="7">7. Surds</option>
            <option value="8">8. Sets</option>
            <option value="9">9. Algebraic Expressions</option>
            <option value="10">10. Factorization</option>
            <option value="11">11. Linear Equations</option>
            <option value="12">12. Change of Subject of Formula</option>
            <option value="13">13. Simultaneous Equations</option>
            <option value="14">14. Quadratic Equations</option>
            <option value="15">15. Variation</option>
            <option value="16">16. Sequence and Series</option>
            <option value="17">17. Binary Operations</option>
            <option value="18">18. Modular Arithmetic</option>
            <option value="19">19. Plane Geometry</option>
            <option value="20">20. Angles and Lines</option>
            <option value="21">21. Triangles</option>
            <option value="22">22. Quadrilaterals and Polygons</option>
            <option value="23">23. Circles</option>
            <option value="24">24. Mensuration of Plane Shapes</option>
            <option value="25">25. Mensuration of Solids</option>
            <option value="26">26. Coordinate Geometry</option>
            <option value="27">27. Straight Lines and Graphs</option>
            <option value="28">28. Trigonometry</option>
            <option value="29">29. Bearings and Distances</option>
            <option value="30">30. Statistics</option>
            <option value="31">31. Measures of Central Tendency</option>
            <option value="32">32. Probability</option>
            <option value="33">33. Permutation</option>
            <option value="34">34. Combination</option>
            <option value="35">35. Introduction to Matrices</option>
        </select>

        <section id="lesson">
            <p>Select a topic above to begin learning.</p>
        </section>

    </main>

    <script>
        function showTopic() {

            const topic = document.getElementById("topicSelect").value;
            const lesson = document.getElementById("lesson");

            if (topic === "") {
                lesson.innerHTML =
                    "<p>Select a topic above to begin learning.</p>";
                return;
            }

            const topics = {
                1: "Number Bases",
                2: "Fractions and Decimals",
                3: "Approximation and Estimation",
                4: "Standard Form",
                5: "Logarithms",
                6: "Indices",
                7: "Surds",
                8: "Sets",
                9: "Algebraic Expressions",
                10: "Factorization",
                11: "Linear Equations",
                12: "Change of Subject of Formula",
                13: "Simultaneous Equations",
                14: "Quadratic Equations",
                15: "Variation",
                16: "Sequence and Series",
                17: "Binary Operations",
                18: "Modular Arithmetic",
                19: "Plane Geometry",
                20: "Angles and Lines",
                21: "Triangles",
                22: "Quadrilaterals and Polygons",
                23: "Circles",
                24: "Mensuration of Plane Shapes",
                25: "Mensuration of Solids",
                26: "Coordinate Geometry",
                27: "Straight Lines and Graphs",
                28: "Trigonometry",
                29: "Bearings and Distances",
                30: "Statistics",
                31: "Measures of Central Tendency",
                32: "Probability",
                33: "Permutation",
                34: "Combination",
                35: "Introduction to Matrices"
            };

            lesson.innerHTML = `
                <h2>Topic ${topic}: ${topics[topic]}</h2>

                <h3>Lesson</h3>
                <p>
                    Comprehensive lesson content for this topic will be
                    provided here.
                </p>

                <h3>Worked Examples</h3>
                <p>Worked examples will be provided here.</p>

                <h3>Practice Questions</h3>
                <p>Practice questions will be provided here.</p>

                <h3>Answers</h3>
                <p>Answers will be provided here.</p>
            `;
        }
    </script>

</body>
</html>
